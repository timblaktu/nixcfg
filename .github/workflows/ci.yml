name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Nightly full run: adds the heavy QEMU compose-stack + package/tarball builds
    # on top of the per-PR jobs (which also run here for a complete nightly signal).
    - cron: '0 6 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Check names below track the post-plan-054 suite (57 checks, x86_64/aarch64 mirrored).
# Regenerate the source-of-truth list with:
#   nix eval '.#checks.x86_64-linux' --apply builtins.attrNames
jobs:
  eval:
    name: Flake evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - name: Evaluate flake metadata
        run: nix flake metadata
      - name: Evaluate check names (both arches)
        run: |
          nix eval '.#checks.x86_64-linux' --apply builtins.attrNames
          nix eval '.#checks.aarch64-linux' --apply builtins.attrNames

  lint:
    name: Lint (${{ matrix.check }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check:
          - lint-formatting
          - lint-statix
          - lint-deadnix
          - lint-ps1-encoding
          - lint-version
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - name: ${{ matrix.check }}
        run: nix build '.#checks.x86_64-linux.${{ matrix.check }}' --print-build-logs

  # Tier-0 eval-regression gate + integration/module/opencode/skill/activate checks.
  # These are the eval-only + light build checks; all run per-PR.
  checks:
    name: Check (${{ matrix.check }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        check:
          # Tier-0 eval-regression gates
          - regression-test
          - eval-hm-modules
          - eval-nixos-modules
          - eval-wsl-settings-ssh-port
          # Toplevel / tarball / image eval forcers (renamed from build-*-dryrun)
          - eval-nixos-dev-team-toplevel
          - eval-nixos-wsl-minimal-toplevel
          - eval-thinky-nixos-toplevel
          - eval-nixos-wsl-dev-team-tarball
          - eval-thinky-nixos-tarball
          - eval-images-dev-team
          - eval-images-ec2
          - eval-images-graviton
          # Module / integration checks
          - files-module-test
          - module-base-integration
          - module-binfmt-integration
          - tmux-picker-syntax
          - user-configured
          - wsl-dev-team-setup-username-user
          # OpenCode config checks
          - opencode-json-syntax
          - opencode-mcp-structure
          # Skill prompt-injection guards
          - skill-injection-awscli
          - skill-injection-glab
          - skill-injection-negative
          - skill-injection-pulumi
          # HM activation-package builds (build-tier)
          - activate-hm-nixvim-minimal
          - activate-hm-thinky-nixos
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - name: ${{ matrix.check }}
        run: nix build '.#checks.x86_64-linux.${{ matrix.check }}' --print-build-logs

  # Behavioral VMTests on the systemd-nspawn container backend (plan 054 P5c).
  # No KVM needed -> runs on BOTH x86_64 and aarch64 (native arm64 runner).
  # nspawn requires the builder to advertise the `uid-range` system feature via
  # auto-allocate-uids (see docs/TESTING-NSPAWN.md).
  vmtest-nspawn:
    name: VMTest nspawn (${{ matrix.check }} · ${{ matrix.target.system }})
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - { runner: ubuntu-latest, system: x86_64-linux }
          - { runner: ubuntu-24.04-arm, system: aarch64-linux }
        check:
          - vm-nspawn-smoke
          - vm-system-type-default
          - vm-sops-secrets
          - vm-hm-activation
          - vm-shell-env
          - vm-neovim
          - vm-tmux
          - vm-git-advanced
          - vm-hm-composition-pairs
          - vm-hm-module-isolation
          - vm-development-tools
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes auto-allocate-uids cgroups
            auto-allocate-uids = true
            extra-system-features = uid-range
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - name: ${{ matrix.check }}
        run: nix build '.#checks.${{ matrix.target.system }}.${{ matrix.check }}' --print-build-logs

  # Behavioral VMTests on the QEMU backend (need /dev/kvm -> x86_64 only; GitHub
  # arm64 runners have no KVM). install-nix-action auto-enables KVM when present.
  # vm-compose-stack is excluded here (heavy ~6min) and runs in the nightly job.
  vmtest-qemu:
    name: VMTest QEMU (${{ matrix.check }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        check:
          - vm-boot-minimal
          - vm-system-type-cli
          - vm-system-type-desktop
          - vm-ssh-service
          - vm-user-config
          - vm-wsl-dev-team-layers
          - vm-dev-team-vm-smoketest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - name: ${{ matrix.check }}
        run: nix build '.#checks.x86_64-linux.${{ matrix.check }}' --print-build-logs

  # --- Nightly + manual-dispatch only (heavy) ---------------------------------

  # The broad cross-module composition test (two full QEMU VMs, ~80 asserts, ~6min).
  # Its constituent modules each have a fast per-PR test; this gates whole-stack +
  # real-host-module composition, a rarer regression class -> nightly is sufficient.
  vmtest-compose-stack:
    name: VMTest QEMU (vm-compose-stack · nightly)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - name: vm-compose-stack
        run: nix build '.#checks.x86_64-linux.vm-compose-stack' --print-build-logs

  # Custom package builds (heavy ML/Python closures) -> nightly, not per-PR.
  pkgs:
    name: Package build (${{ matrix.check }} · nightly)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    # timeout-minutes is a ceiling only (the 5 active builds finish well under an hour).
    # 350 is retained for when build-docling is re-enabled: its uncached C++ closure
    # (arrow-cpp + onnxruntime + google-cloud-cpp, from the nixpkgs-docling fork rev) is
    # genuinely >2 hr on a GitHub runner - run 32612864168 was CANCELLED at the prior
    # 120-min cap while still actively compiling (a wall-clock limit, NOT a build error).
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        check:
          # build-docling is SKIPPED (plan 054 P10): the nlohmann FOD hash-drift + C++
          # closure are fixed (P9), but docling-parse-4.5.0 will not compile against
          # nlohmann under GCC14 with either 3.10.5 (input_adapter ambiguous) or 3.11.3
          # (basic_json bool SFINAE) - a distinct upstream compat blocker. Running it
          # nightly would burn ~2.5 hr building the closure only to fail at docling-parse.
          # Re-enable (uncomment) when P10 lands. Still buildable on demand via
          # `nix build '.#checks.x86_64-linux.build-docling'` / workflow_dispatch.
          # - build-docling
          - build-marker-pdf
          - build-markitdown
          - build-nixvim-anywhere
          - build-termux-claude-scripts
          - build-tomd
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - name: ${{ matrix.check }}
        run: nix build '.#checks.x86_64-linux.${{ matrix.check }}' --print-build-logs

  # Real WSL tarball builds (shipped-image path) -> nightly, not per-PR.
  tarball-build:
    name: Tarball (${{ matrix.config }} · nightly)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: nixos-wsl-dev-team
            artifact: nixcfg-wsl-dev-team
          - config: thinky-nixos
            artifact: nixcfg-thinky-nixos
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = kvm
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - name: Build tarball builder
        run: nix build '.#nixosConfigurations.${{ matrix.config }}.config.system.build.tarballBuilder' --print-build-logs
      - name: Build tarball
        run: sudo ./result/bin/nixos-wsl-tarball-builder nixos.wsl
      - name: Verify tarball
        run: |
          ls -lh nixos.wsl
          file nixos.wsl
